# Конвейер сервиса.
#
# Служебный контейнер Postgres поднимается сразу под нужную базу: имя,
# пользователь и пароль совпадают с тем, что тесты берут по умолчанию,
# поэтому отдельный скрипт создания баз здесь не нужен.
#
# Контракты и обвяз ставить отдельно тоже не нужно — они объявлены
# зависимостями с адресом репозитория и приезжают сами.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics_user
          POSTGRES_PASSWORD: analytics_pass
          POSTGRES_DB: analytics_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер
        run: |
          pip install ruff
          ruff check .

      - name: Модульные тесты
        run: python -m pytest tests/unit -q

      - name: Интеграционные тесты
        run: python -m pytest tests/integration -q

      - name: Образ собирается
        run: docker build -t analytics-service:ci .
