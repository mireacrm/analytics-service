# Конвейер сервиса.
#
# Служебный контейнер Postgres поднимается сразу под нужную базу: имя,
# пользователь и пароль совпадают с тем, что тесты берут по умолчанию,
# поэтому отдельный скрипт создания баз здесь не нужен.
#
# Контракты и обвяз ставить отдельно тоже не нужно — они объявлены
# зависимостями с адресом репозитория и приезжают сами.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics_user
          POSTGRES_PASSWORD: analytics_pass
          POSTGRES_DB: analytics_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U analytics_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Линтер
        run: |
          pip install ruff
          ruff check .

      - name: Модульные тесты
        run: python -m pytest tests/unit -q

      - name: Интеграционные тесты
        run: python -m pytest tests/integration -q

      - name: Образ собирается
        run: docker build -t analytics-service:ci .

  publish:
    name: Публикация образа
    needs: tests
    # Только с главной ветки: образ с latest обязан соответствовать ей.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mireacrm/analytics-service
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
