[project]
name = "analytics-service"
version = "0.1.0"
description = "Аналитика: выручка, загрузка специалистов, расход материалов"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "grpcio>=1.68",
    "grpcio-reflection>=1.68",
    "aio-pika>=9.5",
    "mirea-contracts @ git+https://github.com/mireacrm/contracts-py@v0.1.1",
    "mireacrm-common[db,events,grpc] @ git+https://github.com/mireacrm/py-common@v0.1.1",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-grpc>=0.49b0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "N802", "N803",              # gRPC-методы обязаны быть в CamelCase
    "RUF001", "RUF002", "RUF003", # кириллица в строках и комментариях — не опечатка
    "B008",                       # Depends() в аргументах — идиома FastAPI
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "UP007", "UP035"]
